# Local dev stack. `docker compose up --build` starts everything.
#
# Hostnames: inside the compose network services reach each other by service
# name (postgres, redis) on their internal ports. `.env` uses localhost, which
# is correct for tools run on your host machine (tests, the indexing CLI), so
# the URLs are overridden below for containers.

x-python-env: &python-env
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codelens}:${POSTGRES_PASSWORD:-codelens}@postgres:5432/${POSTGRES_DB:-codelens}
    REDIS_URL: redis://redis:6379/0
    # Ollama runs natively on the host (GPU); see planning.md D21.
    OLLAMA_BASE_URL: http://host.docker.internal:11434
  # Docker Desktop defines host.docker.internal itself; this makes it work on Linux too.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-api-build: &api-build
  context: .
  dockerfile: services/api/Dockerfile

# Two workers from one image, one per queue (planning.md §5.10, D88): `index`
# runs CPU work two at a time; `gpu` runs embedding and reviews one at a time,
# so two jobs never compete for the GPU's memory.
x-worker: &worker
  <<: *python-env
  build:
    context: .
    dockerfile: services/worker/Dockerfile
  # Celery has no auto-reload; run `docker compose restart worker worker-gpu` after edits.
  volumes:
    - ./services/worker/src:/app/services/worker/src
    - ./packages/core/src:/app/packages/core/src
    - ./configs:/app/configs
    # Bare mirrors of GitHub repos (DATA_DIR=data, relative to /app).
    - ./data:/app/data
    # The GitHub App's private key (docs/github-app.md), read-only.
    - ./secrets:/app/secrets:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelens}
      POSTGRES_DB: ${POSTGRES_DB:-codelens}
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres.
      # Loopback only (IPv4 and IPv6, since Windows resolves localhost to ::1 first):
      # the default superuser password must not be reachable from the
      # network the machine is on (D127). Containers use the Compose network instead.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
      - "[::1]:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only: Redis has no password and is the workers' job queue, so anyone
      # who can reach it can queue reviews (D127). Host tools still use localhost:6379.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
      - "[::1]:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations, then exits. api/worker wait for it to succeed,
  # so app code never runs against an out-of-date schema. Reuses the api image
  # (which contains core + alembic).
  migrate:
    <<: *python-env
    build: *api-build
    command: alembic -c packages/core/alembic.ini upgrade head
    volumes:
      - ./packages/core:/app/packages/core
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *python-env
    build: *api-build
    # --reload + bind mounts give hot reload during development.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/services/api/src --reload-dir /app/packages/core/src
    ports:
      # Loopback only (D127): the dashboard calls it on localhost, and the relay
      # reaches it as api:8000 on the Compose network.
      - "127.0.0.1:${API_PORT:-8000}:8000"
      - "[::1]:${API_PORT:-8000}:8000"
    volumes:
      - ./services/api/src:/app/services/api/src
      - ./packages/core/src:/app/packages/core/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; Python's stdlib does the job. urlopen raises
      # on the 503 that /health returns when a dependency is down.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  worker:
    <<: *worker
    command: celery -A worker.celery_app worker -Q index -c 2 -n index@%h --loglevel=INFO

  worker-gpu:
    <<: *worker
    command: celery -A worker.celery_app worker -Q gpu -c 1 -n gpu@%h --loglevel=INFO

  # The poller (Phase 11, D145): asks GitHub about installations, pushes and
  # pull requests every GITHUB_POLL_INTERVAL_S seconds instead of waiting for
  # webhooks, so it needs no relay and catches up after the machine sleeps.
  # Opt-in here (`docker compose --profile poller up -d`); CodeLens Desktop
  # always runs it. Running it beside the relay is safe: both feed one intake.
  poller:
    <<: *python-env
    build: *api-build
    profiles: ["poller"]
    command: python -m api.poller
    volumes:
      - ./services/api/src:/app/services/api/src
      - ./packages/core/src:/app/packages/core/src
      # The GitHub App's private key, read-only.
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The webhook relay (Phase 8): forwards GitHub's events from your smee.io
  # channel (SMEE_URL in .env) to the API, so no Node is needed on the host.
  # Opt-in, because a relay is only one way in: `codelens setup` starts it with
  # `docker compose --profile relay up -d`.
  smee:
    image: node:22-alpine
    profiles: ["relay"]
    command: ["npx", "-y", "smee-client@5.0.0", "--url", "${SMEE_URL:-}", "--target", "http://api:8000/webhooks/github"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
