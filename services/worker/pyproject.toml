[project]
name = "codelens-worker"
version = "0.1.0"
description = "CodeLens background jobs: clone, parse, embed, build graph"
requires-python = ">=3.12"
dependencies = [
    "codelens-core",
    "celery[redis]>=5.4",
]

[tool.uv.sources]
codelens-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
