name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # Real Postgres + Redis so integration tests (migrations, /health) run in CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codelens
          POSTGRES_PASSWORD: codelens
          POSTGRES_DB: codelens
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U codelens" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://codelens:codelens@localhost:5433/codelens
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Demo API pins match uv.lock
        run: uv run python scripts/export_demo_requirements.py --check
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json # reads the pinned "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # CodeLens Desktop (planning-v2.md Phase 11): the type check (the app and its
  # stack driver) and the tests.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # The tests and the type check need Electron's types, not its ~100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # The dashboard end to end (Phase 10 step 8, D162): the API in demo mode over
  # the demo export, the dashboard built for production, Playwright clicking
  # through it, axe checking it, and screenshots compared with the stored ones.
  e2e:
    runs-on: ubuntu-latest
    # The image the stored screenshots were rendered in (apps/web/e2e/README.md):
    # the same browser and fonts, so they compare pixel for pixel.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codelens
          POSTGRES_PASSWORD: codelens
          POSTGRES_DB: codelens
        options: >-
          --health-cmd "pg_isready -U codelens" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # Inside a container job, services are reached by their names.
      E2E_DATABASE_URL: postgresql+asyncpg://codelens:codelens@postgres:5432/codelens
      REDIS_URL: redis://redis:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (Python)
        run: uv sync --frozen
      - name: Load the demo export
        run: uv run python scripts/e2e_data.py apps/web/e2e/fixtures/codelens-demo.json.gz --database-url "$E2E_DATABASE_URL"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install (web)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Playwright
        working-directory: apps/web
        run: pnpm e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
