# Phase 4 step 2 ablation (Q12): the default + split diff rendering (each hunk
# before/after, so moved or rewritten lines aren't read as duplicates).
# Measured against default.yaml in evals/RESULTS.md.
name: default_split
retrieval:
  enabled: true
  vector_k: 8
  max_seeds: 24
packing:
  diff_share: 0.4
  changed_share: 0.25
  context_share: 0.35
  diff_tokens: 4000
  changed_node_tokens: 3500
  context_tokens: 4000
  max_chunks: 4
  degrade_to_signature: true
  test_file_weight: 0.25
  diff_style: split
generation:
  think: false
  max_output_tokens: 1500
  max_findings_per_chunk: 8
validation:
  min_confidence: 0.6
  max_comments: 5
  anchor_window: 3
  anchor_deletions: true
