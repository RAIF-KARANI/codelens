# The adopted pipeline: B0 plus every upgrade that passed the eval gate
# (evals/RESULTS.md). `python -m core.review` uses it when no --config is given.
#
# Adopted so far:
#   Phase 4 step 1, A1 anchoring (anchor_window, anchor_deletions): test F1 +0.113
#   [+0.040, +0.194] over b0, noise unchanged.
name: default
retrieval:
  enabled: true
  vector_k: 8
  max_seeds: 24
packing:
  diff_share: 0.40
  changed_share: 0.25
  context_share: 0.35
  diff_tokens: 4000
  changed_node_tokens: 3500
  context_tokens: 4000
  max_chunks: 4
  degrade_to_signature: true
  test_file_weight: 0.25
generation:
  think: false
  max_output_tokens: 1500
  max_findings_per_chunk: 8
validation:
  min_confidence: 0.6
  max_comments: 5
  anchor_window: 3
  anchor_deletions: true
