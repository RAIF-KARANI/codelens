[project]
name = "codelens-core"
version = "0.1.0"
description = "Shared CodeLens library: config, db models, parser, retrieval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    # <0.26: py-tree-sitter 0.26.0 segfaults reading Node.start_point on larger
    # files (reproduced on Windows, 2026-10-10). Re-test before lifting the pin.
    "tree-sitter>=0.25.2,<0.26",
    # Official per-language grammar wheels: hash-pinned in uv.lock, no runtime
    # downloads (unlike tree-sitter-language-pack 1.x).
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "pathspec>=1.1.1",
    "httpx>=0.27",
    # [crypto]: RS256, for the GitHub App's JWT (core/github/auth.py).
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is codelens-core; import name is `core`.
[tool.hatch.build.targets.wheel]
packages = ["src/core"]
