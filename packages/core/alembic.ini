# Alembic config. Run from the repo root:
#   uv run alembic -c packages/core/alembic.ini upgrade head
#
# The database URL is NOT set here; env.py reads DATABASE_URL via core.config.

[alembic]
script_location = %(here)s/src/core/db/migrations
# Date-prefixed filenames keep migrations sorted chronologically in the editor.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Format newly generated migrations so they pass `ruff format --check` in CI.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
